<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>voice clone dataset viewer</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; display: flex;
         height: 100vh; background: Canvas; color: CanvasText; }
  #sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid #3333; overflow-y: auto;
             padding: 12px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
                opacity: 0.6; margin: 4px 0 10px; }
  .split-btn { display: flex; gap: 6px; margin-bottom: 12px; }
  .split-btn button { flex: 1; padding: 6px; border-radius: 8px; border: 1px solid #8884;
                       background: transparent; color: inherit; cursor: pointer; font-size: 12px; }
  .split-btn button.active { background: #007aff; color: #fff; border-color: #007aff; }
  .thread-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
                 margin-bottom: 2px; display: flex; justify-content: space-between; }
  .thread-item:hover { background: #8882; }
  .thread-item.active { background: #007aff; color: #fff; }
  .thread-item .count { opacity: 0.6; font-size: 12px; }
  .thread-item.active .count { opacity: 0.85; }
  #main { flex: 1; overflow-y: auto; padding: 24px; }
  #main h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em;
             opacity: 0.6; margin: 0 0 16px; }
  .card { max-width: 620px; margin: 0 0 22px; border: 1px solid #8883; border-radius: 12px;
          padding: 14px 16px; }
  .card .idx { font-size: 11px; opacity: 0.45; margin-bottom: 8px; }
  .msgline { display: flex; margin-bottom: 6px; }
  .bubble { padding: 7px 11px; border-radius: 14px; max-width: 78%; line-height: 1.35;
            font-size: 14px; white-space: pre-wrap; }
  .row-user { justify-content: flex-start; }
  .row-user .bubble { background: #fff; color: #000; border: 1px solid #e0e0e0; }
  .row-assistant { justify-content: flex-end; }
  .row-assistant .bubble { background: #007aff; color: #fff; }
  .sysline { font-size: 11px; opacity: 0.4; margin-bottom: 10px; font-style: italic; }
  input#search { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid #8884;
                 background: transparent; color: inherit; margin-bottom: 10px; font-size: 13px; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="split-btn">
    <button id="btn-train" class="active">train (3001)</button>
    <button id="btn-heldout">heldout (242)</button>
  </div>
  <input id="search" placeholder="filter threads...">
  <h3>threads</h3>
  <div id="thread-list"></div>
</div>
<div id="main">
  <h2 id="main-title">select a thread</h2>
  <div id="cards"></div>
</div>
<script>
let DATA = null;
let split = 'train';
let activeThread = null;

fetch('data.json').then(r => r.json()).then(d => {
  DATA = d;
  renderThreadList();
});

function threadCounts(rows) {
  const c = {};
  for (const r of rows) c[r.thread] = (c[r.thread] || 0) + 1;
  return c;
}

function renderThreadList() {
  const rows = DATA[split];
  const counts = threadCounts(rows);
  const threads = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const filter = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('thread-list');
  list.innerHTML = '';
  for (const t of threads) {
    if (filter && !t.toLowerCase().includes(filter)) continue;
    const div = document.createElement('div');
    div.className = 'thread-item' + (t === activeThread ? ' active' : '');
    div.innerHTML = `<span>${t}</span><span class="count">${counts[t]}</span>`;
    div.onclick = () => { activeThread = t; renderThreadList(); renderCards(); };
    list.appendChild(div);
  }
}

function renderCards() {
  const rows = DATA[split].filter(r => r.thread === activeThread);
  document.getElementById('main-title').textContent =
    activeThread ? `${activeThread} — ${rows.length} examples (${split})` : 'select a thread';
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  rows.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const dateStr = r.session_start
      ? new Date(r.session_start * 1000).toLocaleString(undefined, {
          month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
        })
      : '';
    let html = `<div class="idx">example ${i + 1}${dateStr ? ' — session started ' + dateStr : ''}</div>`;
    for (const m of r.messages) {
      if (m.role === 'system') continue;
      const cls = m.role === 'user' ? 'row-user' : 'row-assistant';
      const escaped = m.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html += `<div class="msgline ${cls}"><div class="bubble">${escaped}</div></div>`;
    }
    card.innerHTML = html;
    cards.appendChild(card);
  });
}

document.getElementById('btn-train').onclick = () => {
  split = 'train'; activeThread = null;
  document.getElementById('btn-train').classList.add('active');
  document.getElementById('btn-heldout').classList.remove('active');
  renderThreadList(); renderCards();
};
document.getElementById('btn-heldout').onclick = () => {
  split = 'heldout'; activeThread = null;
  document.getElementById('btn-heldout').classList.add('active');
  document.getElementById('btn-train').classList.remove('active');
  renderThreadList(); renderCards();
};
document.getElementById('search').addEventListener('input', renderThreadList);
</script>
</body>
</html>
